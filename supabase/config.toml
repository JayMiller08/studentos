# StudentOS Supabase project configuration.
# `supabase link` then `supabase db push` / `supabase functions deploy`.

project_id = "studentos"

[functions.ai-chat]
verify_jwt = true

[functions.ai-plan]
verify_jwt = true

# ── Payments: Paystack is the live processor (ZAR) ──────────────────────────
[functions.paystack]
verify_jwt = true

[functions.paystack-webhook]
# Paystack signs the raw body with HMAC-SHA512; it sends no JWT, so
# verification must be OFF or every event is rejected before it is checked.
verify_jwt = false

# ── Payments: Stripe, retained for markets Paystack doesn't serve ───────────
[functions.billing]
verify_jwt = true

[functions.stripe-webhook]
# Stripe signs requests; JWT verification must be OFF for the webhook.
verify_jwt = false

[functions.send-reminders]
verify_jwt = false
# Daily at 06:00 UTC — generate assignment/exam reminders server-side.
schedule = "0 6 * * *"
