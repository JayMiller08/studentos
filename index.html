<!doctype html>
<html lang="en">
  <head>
    <script>
      // Consent Mode, before any Google script: denied until the visitor
      // says otherwise. The banner (src/components/cookie-consent.tsx) saves
      // the answer under "cookie-consent"; a returning visitor who accepted
      // is granted here, so the banner never has to ask twice.
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'analytics_storage': 'denied'
      });
      try {
        if (localStorage.getItem('cookie-consent') === 'accepted') {
          gtag('consent', 'update', {
            'ad_storage': 'granted',
            'ad_user_data': 'granted',
            'ad_personalization': 'granted',
            'analytics_storage': 'granted'
          });
        }
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>StudentOS — Your Academic Command Center</title>
    <meta
      name="description"
      content="StudentOS is the operating system for university students. Smart planning, assignment prioritization, focus tools, habits and quizzes that earn real XP — so you always know what to do next."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#2563eb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1220" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="StudentOS" />

    <!-- Open Graph / SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StudentOS" />
    <meta property="og:title" content="StudentOS — Your Academic Command Center" />
    <meta
      property="og:description"
      content="Never wonder what to work on next. StudentOS turns your assignments, classes and goals into a clear daily plan."
    />

    <meta property="og:image" content="%SITE_URL%/icons/icon-512.png" />
